<style>
:root{color-scheme:dark;--heading:#e84141;--text:#c8c8c8;--line:#272727}
*{box-sizing:border-box}
body{margin:0;background:#000;color:var(--text);font:18px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
a{color:#ef8585;text-underline-offset:4px}
a:hover{color:#fff}
a:focus-visible{outline:2px solid #fff;outline-offset:5px}
.hero{text-align:center;padding:64px 24px 42px;background:linear-gradient(110deg,#b50909 0%,#860309 48%,#650a0a 100%)}
.logo{width:64px;height:64px;border-radius:12px;display:block;margin:0 auto 24px}
.hero h1{color:#fff;margin:0;font-size:clamp(28px,4vw,52px);line-height:1.25;font-weight:750;letter-spacing:.3px}
.hero p{color:#e7dede;font-size:20px;margin:24px 0}
.hero a{display:inline-block;color:#eee;font-size:16px;margin-top:10px}
main{max-width:1024px;margin:auto;padding:36px 64px 64px;overflow-wrap:anywhere}
main h1,main h2,main h3,main h4{color:var(--heading);font-weight:500;line-height:1.4}
main h1{font-size:34px;margin:0 0 24px}
main h2{font-size:28px;margin:36px 0 24px}
main h3{font-size:22px;margin:30px 0 18px}
p{margin:0 0 20px}
blockquote{margin:24px 0;padding:8px 18px;border-left:4px solid #831616;background:#110909;color:#bbb}
blockquote p:last-child{margin:0}
hr{border:0;border-top:1px solid var(--line);margin:32px 0}
table{width:100%;border-collapse:collapse;font-size:16px;margin:24px 0}
th,td{border:1px solid #333;padding:12px;text-align:left;vertical-align:top}
th{background:#200a0a;color:#f0c6c6}
td{background:#0a0a0a}
ul{padding-left:24px}
footer{border-top:1px solid var(--line);margin-top:40px;padding-top:20px;font-size:14px;color:#999}
@media(max-width:640px){body{font-size:16px}.hero{padding:36px 18px}.hero p{font-size:17px}.logo{width:56px;height:56px}main{padding:28px 20px 48px}main h1{font-size:27px}main h2{font-size:24px}main h3{font-size:20px}table{font-size:14px}th,td{padding:8px}}
</style>
